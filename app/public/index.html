<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>DevOps Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
<h1>🚀 DevOps Deployment Dashboard</h1>
<p>Node.js Application | Docker | Jenkins | Terraform | AWS</p>
</header>

<section class="card">

<h2>Application Endpoints</h2>

<div class="endpoint">
<span>/health</span>
<a href="/health" target="_blank">Check Health</a>
</div>

<div class="endpoint">
<span>/version</span>
<a href="/version" target="_blank">Check Version</a>
</div>

</section>

<section class="card">

<h2>Technology Stack</h2>

<div class="tech-grid">

<div class="tech">Node.js</div>
<div class="tech">Docker</div>
<div class="tech">Jenkins</div>
<div class="tech">Terraform</div>
<div class="tech">AWS EC2</div>
<div class="tech">Trivy Security Scan</div>

</div>

</section>

<footer>
<p>DevOps Assignment Project</p>
</footer>

</div>

</body>
</html>
